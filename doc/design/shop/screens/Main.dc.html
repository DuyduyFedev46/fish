<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bảng hàng — điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A5BC0}a:hover{color:#1A57B5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.chips::-webkit-scrollbar{display:none}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 150ms ease-out}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible{outline:2px solid #1F66D1;outline-offset:2px}
.on-accent button:focus-visible{outline:2px solid #FFFFFF;outline-offset:-4px}
.search:focus-within{border-color:#1F66D1;box-shadow:0 0 0 3px #EBF2FE}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.swap{animation:swap 180ms cubic-bezier(.23,1,.32,1)}
.bar{animation:up 240ms cubic-bezier(.32,.72,0,1)}
@keyframes swap{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){button:active:not(:disabled){transform:none}.swap,.bar{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBFBFC; color: #17171C; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box">

    <header style="position: sticky; top: 0; z-index: 2; height: 56px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E4E9; padding: 6px 16px; display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" aria-label="Cá Về — trang chủ" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #0E3A73">
        <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; border: 1.5px dashed #8C8C98; background: #F4F4F6; color: #4E4E58; font-size: 8px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none">LOGO</span>
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Cá Về</span>
      </a>
      <a href="Cart.dc.html" aria-label="{{cartLabel}}" style="position: relative; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17171C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1.5 1.5 0 0 0 1.5 1.1h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"></path><circle cx="9.5" cy="19.5" r="1.3"></circle><circle cx="17" cy="19.5" r="1.3"></circle></svg>
        <sc-if value="{{hasCart}}" hint-placeholder-val="{{ true }}">
          <span class="num swap" style="position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{accent}}; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{cartCount}}</span>
        </sc-if>
      </a>
    </header>

    <div style="height: 32px; background: #EBF2FE; color: #1A5BC0; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A5BC0" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11"></path></svg>
      Hải sản cấp đông theo lô · mua từ 1 kg
    </div>

    <div style="padding: 12px 16px 0">
      <label class="search" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid #8C8C98; border-radius: 8px; background: #FFFFFF; transition: box-shadow 150ms ease-out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#686874" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
        <span class="sr">Tìm sản phẩm</span>
        <input type="search" placeholder="Tìm cá, tôm, mực…" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; background: transparent; color: #17171C">
      </label>
    </div>

    <nav aria-label="Danh mục" class="chips" style="display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent)">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </nav>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px 4px">
      <span style="font-size: 13px; color: #4E4E58"><span class="num">{{count}}</span> sản phẩm</span>
      <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #4E4E58; display: flex; align-items: center; gap: 4px; cursor: pointer">Sắp xếp: Giá ↑
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4E4E58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px 108px">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="6">
        <article aria-label="{{p.aria}}" style="background: #FFFFFF; border: 1px solid #E4E4E9; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px">
          <div style="position: relative; width: 100%; aspect-ratio: 3 / 2; border-radius: 8px; background: #F4F4F6; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; opacity: {{p.imgOpacity}}">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#686874" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
            <sc-if value="{{p.isLow}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: 6px; right: 6px; height: 22px; padding: 0 6px; border-radius: 6px; background: #FDF3E3; color: #A85A07; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 3px">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A85A07" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2c0 6 10 6 10 10S7 16 7 22M17 2c0 3-2 4-5 6"></path></svg>
                Sắp hết
              </span>
            </sc-if>
            <sc-if value="{{p.isCombo}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: 6px; left: 6px; height: 22px; padding: 0 6px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E4E4E9; color: #4E4E58; font-size: 12px; font-weight: 500; display: flex; align-items: center">Combo</span>
            </sc-if>
          </div>
          <h3 class="clamp" style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.3; min-height: 36px"><a href="Product.dc.html" style="color: {{p.nameColor}}; text-decoration: none">{{p.name}}</a></h3>
          <div style="display: flex; align-items: baseline; gap: 4px">
            <span class="num" style="font-size: 17px; font-weight: 600; color: {{p.nameColor}}">{{p.priceText}}</span>
            <span style="font-size: 13px; font-weight: 500; color: #4E4E58">/ {{p.unit}}</span>
          </div>
          <div style="font-size: 12px; font-weight: 500; color: #686874; min-height: 18px">{{p.note}}</div>
          <div style="margin-top: auto; padding-top: 6px">
            <sc-if value="{{p.isOut}}" hint-placeholder-val="{{ false }}">
              <a href="tel:[hotline]" aria-label="{{p.contactLabel}}" style="height: 44px; border-radius: 8px; border: 1px solid #D4D4DB; background: #FFFFFF; color: #17171C; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Liên hệ chúng tôi</a>
            </sc-if>
            <sc-if value="{{p.showAdd}}" hint-placeholder-val="{{ true }}">
              <button onClick="{{p.inc}}" aria-label="{{p.addLabel}}" style="width: 100%; height: 44px; border-radius: 8px; border: 1px solid {{accent}}; background: #FFFFFF; color: {{accent}}; font: inherit; font-weight: 600; cursor: pointer">Thêm {{p.stepText}}</button>
            </sc-if>
            <sc-if value="{{p.showStepper}}" hint-placeholder-val="{{ false }}">
              <div class="on-accent swap" style="height: 44px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: space-between">
                <button onClick="{{p.dec}}" aria-label="{{p.decLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
                </button>
                <span class="num" style="color: #FFFFFF; font-weight: 600">{{p.qtyText}}</span>
                <button onClick="{{p.inc}}" aria-label="{{p.incLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                </button>
              </div>
            </sc-if>
          </div>
        </article>
      </sc-for>
    </div>
  </div>

  <div aria-live="polite" class="sr">{{liveText}}</div>

  <sc-if value="{{hasCart}}" hint-placeholder-val="{{ true }}">
    <div class="bar" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; box-shadow: 0 -4px 16px rgba(23,23,28,0.08); padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 6px">
      <a href="Cart.dc.html" style="height: 48px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-weight: 600; padding: 0 16px; text-decoration: none; display: flex; align-items: center; justify-content: space-between">
        <span class="num">{{cartCount}} món · {{cartTotal}}</span>
        <span style="display: flex; align-items: center; gap: 6px">Xem giỏ <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F66D1","options":["#1F66D1","#0E3A73"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all', qty: { p2: 1 }, live: '' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#1F66D1';
    const vnd = (n) => Math.round(n).toLocaleString('vi-VN') + 'đ';
    const kg = (n) => n.toLocaleString('vi-VN') + ' kg';
    const ICON = {
      ca: 'M5 12c2.6-3.6 6-5.5 9.5-5.5 2.7 0 4.7 1.9 6.5 5.5-1.8 3.6-3.8 5.5-6.5 5.5C11 17.5 7.6 15.6 5 12zM5 12L2 8.5M5 12l-3 3.5',
      tom: 'M18 5c-5 0-9 3.5-9 8 0 3 2 5 5 5h3M9 13H5M18 5c2 0 3 1.2 3 3s-1.6 3-3.5 3M12 18l-2 3M16 18l1 3',
      muc: 'M12 3c-3 0-5 3-5 7v3h10v-3c0-4-2-7-5-7zM8 13l-1 7M10.5 13l-.5 8M13.5 13l.5 8M16 13l1 7',
      cua: 'M6 13a6 4 0 1 0 12 0a6 4 0 1 0-12 0M5 10L3 6l3 1M19 10l2-4-3 1M7 16l-2 3M17 16l2 3',
      combo: 'M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8'
    };
    const products = [
      { id: 'p1', cat: 'ca', name: 'Cá thu cắt khúc', price: 330000, note: 'Cắt khúc dày 2–3 cm', stock: 'ok' },
      { id: 'p2', cat: 'muc', name: 'Mực ống làm sạch', price: 278000, note: 'Đã bỏ nội tạng', stock: 'ok' },
      { id: 'p3', cat: 'tom', name: 'Tôm sú', price: 378000, note: 'Size 30–35 con/kg', stock: 'low' },
      { id: 'p4', cat: 'ca', name: 'Cá nục bông', price: 75000, note: 'Nguyên con', stock: 'ok' },
      { id: 'p5', cat: 'ca', name: 'Cá ngừ đại dương phi lê', price: 330000, note: 'Phi lê không da', stock: 'ok' },
      { id: 'p6', cat: 'ca', name: 'Cá bớp cắt lát', price: 290000, note: 'Cắt lát', stock: 'out' },
      { id: 'p7', cat: 'cua', name: 'Ghẹ xanh', price: 420000, note: 'Size 3–4 con/kg', stock: 'low' },
      { id: 'p8', cat: 'combo', name: 'Combo lẩu hải sản', price: 259000, note: 'Mực, tôm, cá thu', stock: 'ok', combo: true }
    ];
    const cats = [
      { id: 'all', label: 'Tất cả' }, { id: 'ca', label: 'Cá' }, { id: 'tom', label: 'Tôm' },
      { id: 'muc', label: 'Mực' }, { id: 'cua', label: 'Cua ghẹ' }, { id: 'combo', label: 'Combo' }
    ];
    const cat = this.state.cat;
    const qty = this.state.qty;
    const setQty = (p, n) => {
      const next = Object.assign({}, this.state.qty);
      if (n <= 0) delete next[p.id]; else next[p.id] = n;
      this.setState({ qty: next, live: n > 0 ? 'Đã cập nhật ' + p.name : 'Đã bỏ ' + p.name + ' khỏi giỏ' });
    };
    const chipBase = 'position: relative; height: 40px; padding: 0 14px; border-radius: 20px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; flex: none; ';
    const chips = cats.map((c) => ({
      label: c.label,
      on: c.id === cat ? 'true' : 'false',
      pick: () => this.setState({ cat: c.id }),
      style: chipBase + (c.id === cat
        ? 'background: ' + accent + '; color: #FFFFFF; border: 1px solid ' + accent + ';'
        : 'background: #FFFFFF; color: #4E4E58; border: 1px solid #D4D4DB;')
    }));
    const items = products
      .filter((p) => cat === 'all' || p.cat === cat)
      .sort((a, b) => ((a.stock === 'out') - (b.stock === 'out')) || (a.price - b.price))
      .map((p) => {
        const q = qty[p.id] || 0;
        const out = p.stock === 'out';
        const step = p.combo ? 1 : 0.5;
        const min = 1;
        const unit = p.combo ? 'combo' : 'kg';
        const qtyText = p.combo ? q + ' combo' : kg(q);
        return Object.assign({}, p, {
          unit,
          icon: ICON[p.cat],
          priceText: vnd(p.price),
          stepText: p.combo ? '1 combo' : '1 kg',
          contactLabel: 'Liên hệ Cá Về hỏi hàng ' + p.name,
          qtyText,
          isCombo: !!p.combo,
          isOut: out,
          isLow: p.stock === 'low',
          imgOpacity: out ? '0.55' : '1',
          nameColor: out ? '#4E4E58' : '#17171C',
          aria: p.name + (out ? ', hết hàng' : p.stock === 'low' ? ', sắp hết' : ''),
          addLabel: 'Thêm ' + (p.combo ? '1 combo ' : '1 kg ') + p.name + ' vào giỏ',
          incLabel: 'Thêm ' + (p.combo ? '1 combo ' : '0,5 kg ') + p.name,
          decLabel: q <= min ? 'Bỏ ' + p.name + ' khỏi giỏ' : 'Bớt ' + (p.combo ? '1 combo ' : '0,5 kg ') + p.name,
          showAdd: !out && q === 0,
          showStepper: !out && q > 0,
          inc: () => setQty(p, q === 0 ? min : q + step),
          dec: () => setQty(p, q <= min ? 0 : q - step)
        });
      });
    let count = 0, total = 0;
    products.forEach((p) => {
      const q = qty[p.id] || 0;
      if (q > 0) count += 1;
      total += q * p.price;
    });
    return {
      accent, chips, items,
      count: items.length,
      hasCart: count > 0,
      cartCount: count,
      cartLabel: 'Giỏ hàng, ' + count + ' món',
      cartTotal: vnd(total),
      liveText: this.state.live
    };
  }
}
</script>
</body>
</html>
