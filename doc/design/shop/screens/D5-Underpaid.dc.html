  <header style="height: 56px; background: #FFFFFF; border-bottom: 1px solid #E4E4E9; display: flex; align-items: center; padding: 0 16px">

      <div style="display: flex; justify-content: space-between; border-top: 1px solid #E4E4E9; padding-top: 10px"><dt style="font-weight: 600">Còn thiếu</dt><dd class="num" style="margin: 0; font-weight: 600; color: #A85A07">[số tiền]</dd></div>
