<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Gợi ý tìm kiếm — Cá Về</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A5BC0}a:hover{color:#1A57B5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 150ms ease-out}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible{outline:2px solid #1F66D1;outline-offset:2px}
.sg-row:hover{background:#F4F4F6}
.drop{transform-origin:top center;animation:dr 200ms cubic-bezier(.23,1,.32,1)}
@keyframes dr{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){a:active,button:active{transform:none}.drop{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBFBFC; color: #17171C; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <header style="height: 56px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E4E9; padding: 0 6px 0 16px; display: flex; align-items: center; gap: 4px">
    <a href="Home.dc.html" aria-label="Cá Về — trang chủ" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #0E3A73; margin-right: auto">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; border: 1.5px dashed #8C8C98; background: #F4F4F6; color: #4E4E58; font-size: 8px; font-weight: 600; display: flex; align-items: center; justify-content: center">LOGO</span>
      <span style="font-size: 17px; font-weight: 600">Cá Về</span>
    </a>
    <a href="Cart.dc.html" aria-label="Giỏ hàng, 3 món" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#17171C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1.5 1.5 0 0 0 1.5 1.1h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"></path><circle cx="9.5" cy="19.5" r="1.3"></circle><circle cx="17" cy="19.5" r="1.3"></circle></svg><span class="num" style="position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #1F66D1; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span></a>
  </header>


  <div inert="" aria-hidden="true" style="position: absolute; top: 112px; left: 0; right: 0; bottom: 0; padding: 0 16px">
    <div style="display: flex; gap: 8px; padding: 12px 0">
      <span style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; background: #1F66D1; color: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center">Tất cả</span>
      <span style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D4D4DB; background: #FFFFFF; color: #4E4E58; font-size: 13px; font-weight: 500; display: flex; align-items: center">Cá</span>
      <span style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D4D4DB; background: #FFFFFF; color: #4E4E58; font-size: 13px; font-weight: 500; display: flex; align-items: center">Tôm</span>
      <span style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D4D4DB; background: #FFFFFF; color: #4E4E58; font-size: 13px; font-weight: 500; display: flex; align-items: center">Mực</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="height: 250px; background: #FFFFFF; border: 1px solid #E4E4E9; border-radius: 10px"></div>
      <div style="height: 250px; background: #FFFFFF; border: 1px solid #E4E4E9; border-radius: 10px"></div>
      <div style="height: 250px; background: #FFFFFF; border: 1px solid #E4E4E9; border-radius: 10px"></div>
      <div style="height: 250px; background: #FFFFFF; border: 1px solid #E4E4E9; border-radius: 10px"></div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; top: 112px; left: 0; right: 0; bottom: 0; background: rgba(23,23,28,0.24)"></div>

  <form role="search" action="Main.dc.html" style="position: relative; z-index: 2; margin: 0; padding: 12px 16px 0">
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid #1F66D1; border-radius: 8px; background: #FFFFFF; box-shadow: 0 0 0 3px #EBF2FE">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F66D1" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <span class="sr">Tìm sản phẩm</span>
      <input type="search" value="mực" autofocus="autofocus" role="combobox" aria-expanded="true" aria-controls="sg-panel" aria-autocomplete="list" placeholder="Tìm cá, tôm, mực…" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; background: transparent; color: #17171C">
    </label>
  </form>

  <div id="sg-panel" class="drop" role="region" aria-label="Gợi ý tìm kiếm" style="position: absolute; z-index: 3; top: 116px; left: 16px; right: 16px; background: #FFFFFF; border: 1px solid #E4E4E9; border-radius: 12px; box-shadow: 0 12px 32px rgba(23,23,28,0.16); overflow: hidden">
    <p role="status" class="sr">2 gợi ý cho “mực”</p>

    <h2 style="margin: 0; padding: 12px 16px 4px; font-size: 12px; font-weight: 600; color: #686874">Gợi ý</h2>
    <ul style="list-style: none; margin: 0; padding: 0 0 4px">
      <li>
        <a href="Product.dc.html" class="sg-row" style="min-height: 60px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #17171C">
          <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 8px; background: #F4F4F6; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#686874" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3 0-5 3-5 7v3h10v-3c0-4-2-7-5-7zM8 13l-1 7M10.5 13l-.5 8M13.5 13l.5 8M16 13l1 7"></path></svg></span>
          <span style="flex: 1; min-width: 0"><span style="font-weight: 600">Mực</span> ống làm sạch</span>
          <span class="num" style="flex: none; font-weight: 600">278.000đ<span style="font-size: 12px; font-weight: 500; color: #4E4E58">/kg</span></span>
        </a>
      </li>
      <li>
        <a href="Product.dc.html" class="sg-row" style="min-height: 60px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #17171C">
          <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 8px; background: #F4F4F6; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#686874" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a5 5 0 0 0-5 5c0 2 1 3 2 4l-3 5M12 3a5 5 0 0 1 5 5c0 2-1 3-2 4l3 5M10 12l-1 8M14 12l1 8M12 12v9"></path></svg></span>
          <span style="flex: 1; min-width: 0">Bạch tuộc làm sạch</span>
          <span class="num" style="flex: none; font-weight: 600">238.000đ<span style="font-size: 12px; font-weight: 500; color: #4E4E58">/kg</span></span>
        </a>
      </li>
    </ul>

    <a href="Main.dc.html" style="height: 48px; padding: 0 16px; border-top: 1px solid #E4E4E9; display: flex; align-items: center; gap: 8px; color: #1A5BC0; font-weight: 600; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A5BC0" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <span style="flex: 1">Xem tất cả kết quả cho “mực”</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A5BC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <sc-if value="{{hasRecent}}" hint-placeholder-val="{{ true }}">
      <div style="border-top: 1px solid #E4E4E9; padding: 4px 4px 12px 16px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 id="h-recent" style="margin: 0; font-size: 12px; font-weight: 600; color: #686874">Tìm gần đây</h2>
          <button type="button" onClick="{{clear}}" aria-label="Xoá lịch sử tìm gần đây" style="height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: #1A5BC0; cursor: pointer">Xoá</button>
        </div>
        <ul aria-labelledby="h-recent" style="list-style: none; margin: 0; padding: 0 12px 0 0; display: flex; flex-wrap: wrap; gap: 8px">
          <li><a href="Main.dc.html" style="height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 22px; border: 1px solid #D4D4DB; background: #FFFFFF; color: #17171C; font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#686874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 8v4l3 2"></path></svg>cá thu</a></li>
          <li><a href="Main.dc.html" style="height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 22px; border: 1px solid #D4D4DB; background: #FFFFFF; color: #17171C; font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#686874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 8v4l3 2"></path></svg>combo lẩu</a></li>
        </ul>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { recent: true };
  }
  renderVals() {
    return {
      hasRecent: this.state.recent,
      clear: () => this.setState({ recent: false })
    };
  }
}
</script>
</body>
</html>
